<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Tezis Sistemi</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        header {
            background: #17365d;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .admin-btn {
            background: white;
            color: #17365d;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
            margin-bottom: 25px;
        }

        h1, h2 {
            color: #17365d;
            margin-bottom: 15px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            background: #17365d;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #102b4a;
        }

        .success {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 7px;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 7px;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            background: #17365d;
            color: white;
        }

        @media (max-width: 700px) {
            header {
                padding: 15px;
            }

            .logo {
                font-size: 18px;
            }

            .box {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">E-Tezis Sistemi</div>

    <button class="admin-btn" onclick="adminPanel()">
        Admin Panel
    </button>
</header>

<div class="container">

    <div class="box">
        <h1>E-Tezis Sisteminə xoş gəlmisiniz</h1>
        <p>
            Tezis və məqalələrin elektron şəkildə göndərilməsi və idarə olunması.
        </p>
    </div>

    <div class="box">
        <h2>📄 Məqalə / Tezis göndər</h2>

        <form id="submissionForm">

            <input
                type="text"
                id="adSoyad"
                placeholder="Ad və soyad"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="E-poçt"
            >

            <input
                type="text"
                id="telefon"
                placeholder="Telefon"
            >

            <input
                type="text"
                id="basliq"
                placeholder="Məqalə / Tezis başlığı"
                required
            >

            <input
                type="text"
                id="movzu"
                placeholder="Mövzu / İxtisas"
            >

            <textarea
                id="mesaj"
                placeholder="Əlavə məlumat..."
            ></textarea>

            <button type="submit">
                Göndər
            </button>

        </form>

        <div class="success" id="success">
            Məlumatınız uğurla göndərildi. ✅
        </div>

        <div class="error" id="error">
            Göndərilmə zamanı xəta baş verdi.
        </div>
    </div>

</div>

<footer>
    © 2026 E-Tezis Sistemi
</footer>

<script>

const SUPABASE_URL =
    "https://qbfzvplfoibgyirqpavi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_pmXwkYmAoAN3l319cGGqFQ_WGIF9eyp";


document
.getElementById("submissionForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const success = document.getElementById("success");
    const error = document.getElementById("error");

    success.style.display = "none";
    error.style.display = "none";

    const data = {
        ad_soyad: document.getElementById("adSoyad").value,
        email: document.getElementById("email").value,
        telefon: document.getElementById("telefon").value,
        basliq: document.getElementById("basliq").value,
        movzu: document.getElementById("movzu").value,
        mesaj: document.getElementById("mesaj").value
    };

    try {

        const response = await fetch(
            SUPABASE_URL + "/rest/v1/mehqale_gonderisleri",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Prefer": "return=minimal"
                },

                body: JSON.stringify(data)
            }
        );

        if (!response.ok) {
            throw new Error("Supabase xətası");
        }

        success.style.display = "block";

        document
        .getElementById("submissionForm")
        .reset();

    } catch (err) {

        console.error(err);

        error.style.display = "block";
    }

});


function adminPanel() {

    alert(
        "Admin paneli növbəti mərhələdə aktiv ediləcək."
    );

}

</script>

</body>
</html>
