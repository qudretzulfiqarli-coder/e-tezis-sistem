<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Tezis Sistemi</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #1f2937;
        }

        header {
            background: #17365d;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .white-btn {
            background: white;
            color: #17365d;
        }

        .blue-btn {
            background: #17365d;
            color: white;
        }

        .red-btn {
            background: #dc2626;
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
            margin-bottom: 25px;
        }

        h1,
        h2,
        h3 {
            color: #17365d;
            margin-bottom: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            background: #e5e7eb;
            color: #374151;
        }

        .tab.active {
            background: #17365d;
            color: white;
        }

        .message {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .article {
            border: 1px solid #e5e7eb;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .article h3 {
            margin-bottom: 8px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            background: #fef3c7;
            color: #92400e;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 8px;
        }

        .facebook {
            display: inline-block;
            margin-top: 10px;
            color: #1877f2;
            font-weight: bold;
            text-decoration: none;
        }

        .user-info {
            font-size: 14px;
        }

        .empty {
            padding: 25px;
            text-align: center;
            color: #6b7280;
        }

        footer {
            margin-top: 50px;
            background: #17365d;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px;
            }

            .logo {
                font-size: 18px;
            }

            .header-right {
                flex-direction: column;
                align-items: flex-end;
            }

            .box {
                padding: 20px;
            }
        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        E-Tezis Sistemi
    </div>

    <div class="header-right">

        <span id="userInfo" class="user-info"></span>

        <button
            id="loginButton"
            class="white-btn"
            onclick="showLogin()">
            Daxil ol
        </button>

        <button
            id="logoutButton"
            class="red-btn hidden"
            onclick="logout()">
            Çıxış
        </button>

    </div>

</header>


<div class="container">

    <!-- ANA SƏHİFƏ -->

    <section id="homeSection" class="box">

        <h1>
            E-Tezis Sisteminə xoş gəlmisiniz
        </h1>

        <p>
            Məqalə və tezislərin elektron şəkildə göndərilməsi və idarə olunması.
        </p>

        <br>

        <button
            class="blue-btn"
            onclick="showLogin()">
            Sistemə daxil ol
        </button>

    </section>


    <!-- GİRİŞ -->

    <section id="loginSection" class="box hidden">

        <h2>
            İstifadəçi girişi
        </h2>

        <div id="loginError" class="message error"></div>

        <input
            type="email"
            id="loginEmail"
            placeholder="E-poçt">

        <input
            type="password"
            id="loginPassword"
            placeholder="Şifrə">

        <button
            class="blue-btn"
            onclick="login()">
            Daxil ol
        </button>

        <button
            class="white-btn"
            onclick="showRegister()">
            Qeydiyyatdan keç
        </button>

    </section>


    <!-- QEYDİYYAT -->

    <section id="registerSection" class="box hidden">

        <h2>
            Yeni istifadəçi qeydiyyatı
        </h2>

        <div id="registerError" class="message error"></div>

        <input
            type="text"
            id="registerName"
            placeholder="Ad və soyad">

        <input
            type="email"
            id="registerEmail"
            placeholder="E-poçt">

        <input
            type="password"
            id="registerPassword"
            placeholder="Şifrə">

        <input
            type="text"
            id="registerPhone"
            placeholder="Telefon">

        <label>
            Təşkilatınız
        </label>

        <select id="registerOrganization">

            <option value="">
                Təşkilat seçin
            </option>

        </select>

        <button
            class="blue-btn"
            onclick="register()">
            Qeydiyyatdan keç
        </button>

        <button
            class="white-btn"
            onclick="showLogin()">
            Girişə qayıt
        </button>

    </section>


    <!-- İSTİFADƏÇİ PANELİ -->

    <section id="userSection" class="hidden">

        <div class="box">

            <h2>
                İstifadəçi paneli
            </h2>

            <p id="welcomeText"></p>

        </div>


        <div class="tabs">

            <button
                id="newArticleTab"
                class="tab active"
                onclick="showNewArticle()">
                ➕ Yeni məqalə
            </button>

            <button
                id="myArticlesTab"
                class="tab"
                onclick="showMyArticles()">
                📋 Mənim məqalələrim
            </button>

        </div>


        <!-- YENİ MƏQALƏ -->

        <div id="newArticleSection" class="box">

            <h2>
                Yeni məqalə əlavə et
            </h2>

            <div
                id="articleSuccess"
                class="message success">
                Məqalə uğurla göndərildi. ✅
            </div>

            <div
                id="articleError"
                class="message error">
            </div>


            <label>
                Təşkilat
            </label>

            <select id="articleOrganization">

                <option value="">
                    Təşkilat seçin
                </option>

            </select>


            <label>
                Məqalənin adı
            </label>

            <input
                type="text"
                id="articleTitle"
                placeholder="Məqalənin tam adı">


            <label>
                Müəllif / müəlliflər
            </label>

            <input
                type="text"
                id="articleAuthors"
                placeholder="Müəlliflərin adları">


            <label>
                Mövzu
            </label>

            <input
                type="text"
                id="articleTopic"
                placeholder="Məqalənin mövzusu">


            <label>
                Açar sözlər
            </label>

            <input
                type="text"
                id="articleKeywords"
                placeholder="Məsələn: iqtisadiyyat, təhsil, texnologiya">


            <label>
                Facebook linki
            </label>

            <input
                type="url"
                id="facebookLink"
                placeholder="https://www.facebook.com/...">


            <label>
                Əlavə məlumat
            </label>

            <textarea
                id="articleInfo"
                placeholder="Məqalə haqqında əlavə məlumat...">
            </textarea>


            <button
                class="blue-btn"
                onclick="addArticle()">
                Məqaləni göndər
            </button>

        </div>


        <!-- MƏQALƏLƏR -->

        <div id="myArticlesSection" class="box hidden">

            <h2>
                Mənim məqalələrim
            </h2>

            <div id="articlesList"></div>

        </div>

    </section>

</div>


<footer>
    © 2026 E-Tezis Sistemi
</footer>


<script>

const SUPABASE_URL =
    "https://qbfzvplfoibgyirqpavi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_pmXwkYmAoAN3l319cGGqFQ_WGIF9eyp";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;


/* =====================================================
   SƏHİFƏLƏR
===================================================== */

function hideAllSections() {

    document
        .getElementById("homeSection")
        .classList.add("hidden");

    document
        .getElementById("loginSection")
        .classList.add("hidden");

    document
        .getElementById("registerSection")
        .classList.add("hidden");

    document
        .getElementById("userSection")
        .classList.add("hidden");
}


function showLogin() {

    hideAllSections();

    document
        .getElementById("loginSection")
        .classList.remove("hidden");

}


function showRegister() {

    hideAllSections();

    document
        .getElementById("registerSection")
        .classList.remove("hidden");

    loadOrganizations(
        "registerOrganization"
    );

}


function showUserPanel() {

    hideAllSections();

    document
        .getElementById("userSection")
        .classList.remove("hidden");

}


/* =====================================================
   TƏŞKİLATLAR
===================================================== */

async function loadOrganizations(selectId) {

    const select =
        document.getElementById(selectId);

    select.innerHTML =
        '<option value="">Təşkilat seçin</option>';

    const { data, error } =
        await supabaseClient
            .from("teskilatlar")
            .select("id, ad")
            .order("ad");

    if (error) {

        console.error(error);

        return;
    }

    data.forEach(function(org) {

        const option =
            document.createElement("option");

        option.value = org.id;

        option.textContent = org.ad;

        select.appendChild(option);

    });

}


/* =====================================================
   QEYDİYYAT
===================================================== */

async function register() {

    const name =
        document.getElementById(
            "registerName"
        ).value.trim();

    const email =
        document.getElementById(
            "registerEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "registerPassword"
        ).value;

    const phone =
        document.getElementById(
            "registerPhone"
        ).value.trim();

    const organization =
        document.getElementById(
            "registerOrganization"
        ).value;


    const errorBox =
        document.getElementById(
            "registerError"
        );


    errorBox.style.display = "none";


    if (
        !name ||
        !email ||
        !password ||
        !organization
    ) {

        errorBox.innerText =
            "Ad, e-poçt, şifrə və təşkilat mütləq doldurulmalıdır.";

        errorBox.style.display = "block";

        return;
    }


    if (password.length < 6) {

        errorBox.innerText =
            "Şifrə ən azı 6 simvol olmalıdır.";

        errorBox.style.display = "block";

        return;
    }


    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password

        });


    if (error) {

        errorBox.innerText =
            error.message;

        errorBox.style.display = "block";

        return;
    }


    if (!data.user) {

        errorBox.innerText =
            "İstifadəçi yaradılmadı.";

        errorBox.style.display = "block";

        return;
    }


    const { error: profileError } =
        await supabaseClient
            .from("profillər")
            .insert({

                id: data.user.id,

                ad_soyad: name,

                telefon: phone,

                teskilat_id: organization

            });


    if (profileError) {

        errorBox.innerText =
            profileError.message;

        errorBox.style.display = "block";

        return;
    }


    alert(
        "Qeydiyyat uğurla tamamlandı."
    );


    showLogin();

}


/* =====================================================
   GİRİŞ
===================================================== */

async function login() {

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const errorBox =
        document.getElementById(
            "loginError"
        );


    errorBox.style.display = "none";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        errorBox.innerText =
            error.message;

        errorBox.style.display = "block";

        return;
    }


    currentUser = data.user;

    await initializeUser();

}


/* =====================================================
   İSTİFADƏÇİNİ YÜKLƏ
===================================================== */

async function initializeUser() {

    if (!currentUser) {
        return;
    }


    const { data: profile } =
        await supabaseClient
            .from("profillər")
            .select(`
                ad_soyad,
                teskilat_id,
                teskilatlar (
                    ad
                )
            `)
            .eq("id", currentUser.id)
            .single();


    if (profile) {

        document
            .getElementById("userInfo")
            .innerText =
            profile.ad_soyad || "";

        document
            .getElementById("welcomeText")
            .innerText =
            "Xoş gəlmisiniz, " +
            (profile.ad_soyad || "") +
            "! Təşkilat: " +
            (
                profile.teskilatlar
                    ? profile.teskilatlar.ad
                    : "Seçilməyib"
            );


        await loadOrganizations(
            "articleOrganization"
        );

        document
            .getElementById(
                "articleOrganization"
            )
            .value =
            profile.teskilat_id || "";

    }


    document
        .getElementById("loginButton")
        .classList.add("hidden");

    document
        .getElementById("logoutButton")
        .classList.remove("hidden");


    showUserPanel();

}


/* =====================================================
   MƏQALƏ ƏLAVƏ ET
===================================================== */

async function addArticle() {

    const errorBox =
        document.getElementById(
            "articleError"
        );

    const successBox =
        document.getElementById(
            "articleSuccess"
        );


    errorBox.style.display = "none";
    successBox.style.display = "none";


    const organization =
        document.getElementById(
            "articleOrganization"
        ).value;

    const title =
        document.getElementById(
            "articleTitle"
        ).value.trim();

    const authors =
        document.getElementById(
            "articleAuthors"
        ).value.trim();

    const topic =
        document.getElementById(
            "articleTopic"
        ).value.trim();

    const keywords =
        document.getElementById(
            "articleKeywords"
        ).value.trim();

    const facebook =
        document.getElementById(
            "facebookLink"
        ).value.trim();

    const info =
        document.getElementById(
            "articleInfo"
        ).value.trim();


    if (!organization || !title) {

        errorBox.innerText =
            "Təşkilat və məqalənin adı mütləq doldurulmalıdır.";

        errorBox.style.display = "block";

        return;
    }


    if (
        facebook &&
        !facebook.startsWith(
            "https://www.facebook.com/"
        ) &&
        !facebook.startsWith(
            "https://facebook.com/"
        )
    ) {

        errorBox.innerText =
            "Facebook linki düzgün formatda deyil.";

        errorBox.style.display = "block";

        return;
    }


    const { error } =
        await supabaseClient
            .from("məqalələr")
            .insert({

                user_id: currentUser.id,

                teskilat_id: organization,

                basliq: title,

                muellif: authors,

                movzu: topic,

                acar_sozler: keywords,

                facebook_link: facebook,

                elave_melumat: info

            });


    if (error) {

        console.error(error);

        errorBox.innerText =
            error.message;

        errorBox.style.display = "block";

        return;
    }


    successBox.style.display = "block";


    document
        .getElementById("articleTitle")
        .value = "";

    document
        .getElementById("articleAuthors")
        .value = "";

    document
        .getElementById("articleTopic")
        .value = "";

    document
        .getElementById("articleKeywords")
        .value = "";

    document
        .getElementById("facebookLink")
        .value = "";

    document
        .getElementById("articleInfo")
        .value = "";

}


/* =====================================================
   MƏQALƏLƏRİ GÖSTƏR
===================================================== */

async function showMyArticles() {

    document
        .getElementById("newArticleSection")
        .classList.add("hidden");

    document
        .getElementById("myArticlesSection")
        .classList.remove("hidden");


    document
        .getElementById("newArticleTab")
        .classList.remove("active");

    document
        .getElementById("myArticlesTab")
        .classList.add("active");


    const list =
        document.getElementById(
            "articlesList"
        );


    list.innerHTML =
        "<p>Yüklənir...</p>";


    const { data, error } =
        await supabaseClient
            .from("məqalələr")
            .select(`
                id,
                basliq,
                muellif,
                movzu,
                acar_sozler,
                facebook_link,
                elave_melumat,
                status,
                created_at,
                teskilatlar (
                    ad
                )
            `)
            .eq("user_id", currentUser.id)
            .order("created_at", {
                ascending: false
            });


    if (error) {

        list.innerHTML =
            "<p>Məqalələri yükləmək mümkün olmadı.</p>";

        console.error(error);

        return;
    }


    if (!data || data.length === 0) {

        list.innerHTML =
            '<div class="empty">Hələ məqalə göndərməmisiniz.</div>';

        return;
    }


    list.innerHTML = "";


    data.forEach(function(article) {

        const div =
            document.createElement("div");

        div.className = "article";


        let facebookHtml = "";

        if (article.facebook_link) {

            facebookHtml =
                `
                <a
                    class="facebook"
                    href="${article.facebook_link}"
                    target="_blank">
                    🔗 Facebook paylaşımını aç
                </a>
                `;

        }


        div.innerHTML = `

            <h3>
                ${escapeHtml(article.basliq)}
            </h3>

            <p>
                <strong>Təşkilat:</strong>
                ${
                    article.teskilatlar
                    ? escapeHtml(article.teskilatlar.ad)
                    : "-"
                }
            </p>

            <p>
                <strong>Müəllif:</strong>
                ${escapeHtml(article.muellif || "-")}
            </p>

            <p>
                <strong>Mövzu:</strong>
                ${escapeHtml(article.movzu || "-")}
            </p>

            ${facebookHtml}

            <br>

            <span class="status">
                ${escapeHtml(article.status || "Yeni")}
            </span>

        `;


        list.appendChild(div);

    });

}


/* =====================================================
   YENİ MƏQALƏ TABI
===================================================== */

function showNewArticle() {

    document
        .getElementById("myArticlesSection")
        .classList.add("hidden");

    document
        .getElementById("newArticleSection")
        .classList.remove("hidden");


    document
        .getElementById("myArticlesTab")
        .classList.remove("active");

    document
        .getElementById("newArticleTab")
        .classList.add("active");

}


/* =====================================================
   ÇIXIŞ
===================================================== */

async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;

    document
        .getElementById("loginButton")
        .classList.remove("hidden");

    document
        .getElementById("logoutButton")
        .classList.add("hidden");

    document
        .getElementById("userInfo")
        .innerText = "";

    hideAllSections();

    document
        .getElementById("homeSection")
        .classList.remove("hidden");

}


/* =====================================================
   TƏHLÜKƏSİZ MƏTN
===================================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


/* =====================================================
   SESSİYA YOXLAMASI
===================================================== */

async function checkSession() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (session && session.user) {

        currentUser =
            session.user;

        await initializeUser();

    }

}


checkSession();

</script>

</body>
</html>
